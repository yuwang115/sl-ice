<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/fvicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SL-ICE — Streamline Lab Interactive Cryosphere Explorer</title>
    <meta name="description" content="Slice off a piece of Antarctica. SL-ICE lets you take a 2D slice through the real Antarctic ice sheet and run it live in your browser — pick a flowline, warm the ocean, dial down the snow, and watch the glacier respond. Sandbox mode, 8 guided challenges, and 100 real Antarctic flowlines." />

    <!-- Google Fonts: Nunito + IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Open Graph: the SITE_URL placeholders become absolute URLs at build time (see vite.config.ts) -->
    <meta property="og:title" content="SL-ICE — Slice Off a Piece of Antarctica" />
    <meta property="og:description" content="Take a 2D slice through the real Antarctic ice sheet and run it live in your browser. Pick a flowline, warm the ocean, dial down the snow, and watch the glacier respond — the same physics glaciologists use, now in your hands." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/landing.html" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SL-ICE — Slice Off a Piece of Antarctica" />
    <meta name="twitter:description" content="Take a 2D slice through the real Antarctic ice sheet and run it live in your browser — the same physics glaciologists use, now in your hands." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
